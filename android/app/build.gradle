plugins {
    id 'com.android.application'
}

import java.util.Properties

// ---------------------------------------------------------------------------
// 版本号：唯一来源。APK 文件名、dist 交付物、README 都引用这里的值。
// 升级版本只改这两行即可，无需改动任何脚本或 CI。
// ---------------------------------------------------------------------------
def appVersionName = "0.13.3"
def appVersionCode = 47
def apkPrefix = "voice-mcp-v${appVersionName}-b${appVersionCode}"

// ---------------------------------------------------------------------------
// release 签名：证书固定为工程内 signing/conring-release.jks，且 debug/release
// 共用同一张证书——所有 APK 的签名永远一致，覆盖安装不会再出现「签名冲突」。
// 缺证书 / 证书被换，构建直接失败（不会悄悄回退到 ~/.android/debug.keystore，
// 那个文件是自动生成的，一旦重建签名就变了，用户必须卸载重装）。
// 真要换证书：删掉下面的 EXPECTED_CERT_SHA256 校验值，或加 -PallowCertChange=true。
// ---------------------------------------------------------------------------
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

// 固化好的证书指纹（SHA-256）——这张证书签出来的包可以直接覆盖安装
def EXPECTED_CERT_SHA256 = "c8db44ed7dda400053f06b84c5db5f4e1d86965158c283f93e60b5727de85bae"
def allowCertChange = project.hasProperty("allowCertChange")

def releaseStore = keystoreProps.getProperty("storeFile") == null
        ? null : rootProject.file(keystoreProps.getProperty("storeFile"))
if (releaseStore == null || !releaseStore.exists()) {
    throw new GradleException("""找不到签名证书：${releaseStore}
请恢复 android/keystore.properties（格式见 keystore.properties.example）与 signing/conring-release.jks。
不允许回退 debug 证书——那会让每次构建的签名都可能不同。""")
}

def actualCertSha256 = {
    def ks = java.security.KeyStore.getInstance(
            releaseStore, keystoreProps.getProperty("storePassword").toCharArray())
    def cert = ks.getCertificate(keystoreProps.getProperty("keyAlias"))
    if (cert == null) throw new GradleException("证书里没有别名 ${keystoreProps.getProperty("keyAlias")}")
    def digest = java.security.MessageDigest.getInstance("SHA-256").digest(cert.getEncoded())
    return digest.collect { String.format("%02x", it) }.join()
}()

if (actualCertSha256 != EXPECTED_CERT_SHA256 && !allowCertChange) {
    throw new GradleException("""签名证书被换过了，已阻断出包：
  期望 SHA-256 ${EXPECTED_CERT_SHA256}
  实际 SHA-256 ${actualCertSha256}
这样装到手机上会签名冲突。确实要换证书就加 -PallowCertChange=true，并同步更新 build.gradle 里的 EXPECTED_CERT_SHA256。""")
}
println "SIGNING PINNED OK: ${actualCertSha256}"

android {
    namespace 'com.boray.voicemcp'
    compileSdk 35

    defaultConfig {
        applicationId "com.boray.voicemcp"
        minSdk 26
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
        // 把版本写进资源，App 端以后可直接读取，避免版本号分散维护
        resValue "string", "build_version_name", appVersionName
        resValue "string", "build_version_code", String.valueOf(appVersionCode)
    }

    signingConfigs {
        // 唯一证书：signing/conring-release.jks（指纹已在上面校验过）
        release {
            storeFile releaseStore
            storePassword keystoreProps.getProperty("storePassword")
            keyAlias keystoreProps.getProperty("keyAlias")
            keyPassword keystoreProps.getProperty("keyPassword")
        }
    }

    buildTypes {
        debug {
            // debug 与 release 共用同一 applicationId + 同一张证书，
            // 任意一个包都能覆盖安装另一个，不会出现「签名冲突」
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    // 输出文件名带版本号与构建号，例如 voice-mcp-v0.3.2-b5-release.apk
    applicationVariants.configureEach { variant ->
        def type = variant.buildType.name
        variant.outputs.configureEach { output ->
            output.outputFileName = "${apkPrefix}-${type}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 纯 Android framework + org.json 实现，零第三方依赖，避免 AndroidX / 额外 Maven 依赖
dependencies {
}

// 版本号防漏：MCP clientInfo.version 必须与 APK 文件名 / defaultConfig 一致
tasks.register('verifyVersionSync') {
    group = 'verification'
    description = 'Ensure McpConfig.CLIENT_VERSION matches appVersionName'
    doLast {
        File cfg = file('src/main/java/com/boray/voicemcp/McpConfig.java')
        def matcher = (cfg.getText('UTF-8') =~ /CLIENT_VERSION\s*=\s*"([^"]+)"/)
        if (!matcher.find()) {
            throw new GradleException('McpConfig.java 中未找到 CLIENT_VERSION')
        }
        String actual = matcher.group(1)
        if (actual != appVersionName) {
            throw new GradleException("版本号不一致：build.gradle=${appVersionName}, McpConfig.CLIENT_VERSION=${actual}")
        }
        println "VERSION SYNC OK: ${appVersionName} (versionCode ${appVersionCode})"
    }
}

// 一键出包：构建 debug + release，并把带版本号的 APK 收集到 dist/
tasks.register('collectApks') {
    group = 'build'
    description = "Build debug + release APKs and copy them into dist/ (${apkPrefix}-*.apk)"
    dependsOn 'verifyVersionSync', 'assembleDebug', 'assembleRelease'
    doLast {
        File dist = new File(rootProject.projectDir, 'dist')
        dist.mkdirs()
        int copied = 0
        List<String> builtNames = []
        ['debug', 'release'].each { type ->
            File dir = new File(buildDir, "outputs/apk/${type}")
            dir.listFiles()?.findAll { it.isFile() && it.name.endsWith('.apk') }?.each { apk ->
                copy {
                    from apk
                    into dist
                }
                println "  APK -> dist/${apk.name} (${apk.length()} bytes)"
                builtNames << apk.name
                copied++
            }
        }
        if (copied != 2) {
            throw new GradleException("Expected 2 APKs in dist/, got ${copied}")
        }

        // 每次构建都把本次产物镜像一份到外部目录（默认 /mnt/sefs/conring/tmp），
        // 可用 -PapkMirrorDir=/xxx 覆盖；挂载点不可用时只告警，不阻断出包。
        String mirrorPath = (project.findProperty('apkMirrorDir') ?: '/mnt/sefs/conring/tmp').toString()
        File mirrorDir = new File(mirrorPath)
        if (mirrorDir.isDirectory() || mirrorDir.mkdirs()) {
            builtNames.each { name ->
                File src = new File(dist, name)
                copy {
                    from src
                    into mirrorDir
                }
                println "  MIRROR -> ${mirrorDir.absolutePath}/${name}"
            }
        } else {
            println "  WARN: 镜像目录不可用，已跳过：${mirrorDir.absolutePath}"
        }
        println "DONE: ${copied} APKs, release signing = " +
                "signing/conring-release.jks (固定证书 ${actualCertSha256.substring(0, 16)}…)"
    }
}
