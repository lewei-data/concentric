<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>知识图谱 · 多节点 + 异常检测 预览</title>
<style>
  :root{--土:#b45309;--水:#1e40af;--木:#059669;--金:#a16207;--火:#dc2626;--bg:#0f1220;--panel:#171a2b;--line:#2a2f45;--txt:#e8ecf5;--dim:#8b93ad}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt)}
  header{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:15px;margin:0}
  .sub{color:var(--dim);font-size:12px}
  .toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  button{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12px}
  button:hover{border-color:#4b557a}
  button.on{background:#26304f;border-color:#5b6aa8}
  .chip{padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:12px}
  .chip.on{border-color:#5b6aa8;background:#26304f}
  main{display:flex;height:calc(100vh - 52px)}
  #canvas{flex:1;position:relative;overflow:hidden}
  svg{width:100%;height:100%;display:block}
  .side{width:330px;background:var(--panel);border-left:1px solid var(--line);padding:14px;overflow:auto;font-size:13px}
  .card{background:#11142a;border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:11px}
  .card h2{font-size:13px;margin:0 0 7px;color:#cdd5ee}
  .stat{display:flex;justify-content:space-between;padding:3px 0;color:var(--dim)}
  .stat b{color:var(--txt)}
  .anom{display:flex;gap:7px;padding:5px 0;border-bottom:1px dashed #232a44;font-size:12px;align-items:flex-start}
  .tag{display:inline-block;background:#222a47;border-radius:6px;padding:1px 7px;margin:2px 3px 0 0;font-size:11px;color:#aeb8d8}
  .legend{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--dim)}
  .lg{display:flex;align-items:center;gap:5px}
  .dot{width:11px;height:11px;border-radius:50%}
  .hint{color:var(--dim);font-size:12px;line-height:1.6}
  .pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px}
  .生{background:rgba(5,150,105,.18);color:#4ade80}
  .克{background:rgba(220,38,38,.18);color:#f87171}
  .关联{background:rgba(96,116,180,.18);color:#9db0e8}
  .warn{color:#fbbf24}.bad{color:#f87171}.ok{color:#4ade80}
  a{color:#7ea2ff}
</style>
</head>
<body>
<header>
  <div><h1>知识图谱 · 多节点 + 异常检测 预览</h1>
  <div class="sub">~70 节点压测 · 分类过滤 / 点击聚焦 / 五行聚类下钻 · 红色=异常（孤儿·污染簇·决策缺支撑）</div></div>
  <div class="toolbar">
    <button id="btnReset">重置</button>
    <button id="btnDegree">中心度</button>
    <button id="btnCluster">五行聚类</button>
    <button id="btnAnomaly" class="on">异常视图</button>
    <span class="chip on" data-el="all">全部</span>
    <span class="chip" data-el="土" style="border-color:var(--土)">土</span>
    <span class="chip" data-el="水" style="border-color:var(--水)">水</span>
    <span class="chip" data-el="木" style="border-color:var(--木)">木</span>
    <span class="chip" data-el="金" style="border-color:var(--金)">金</span>
    <span class="chip" data-el="火" style="border-color:var(--火)">火</span>
  </div>
</header>
<main>
  <div id="canvas"><svg id="svg"></svg></div>
  <aside class="side">
    <div class="card">
      <h2>图统计</h2>
      <div class="stat"><span>节点总数</span><b id="sNodes">–</b></div>
      <div class="stat"><span>关系边</span><b id="sEdges">–</b></div>
      <div class="stat"><span>连通主网</span><b id="sMain">–</b></div>
      <div class="stat"><span>异常节点</span><b id="sAnom" class="bad">–</b></div>
    </div>
    <div class="card">
      <h2>⚠ 异常检测（图谱自动发现）</h2>
      <div id="anomBox" class="hint">计算中…</div>
    </div>
    <div class="card" id="infoCard">
      <h2>选中节点</h2>
      <div class="hint" id="info">悬停/点击节点看详情；点「异常视图」只看异常；点五行 chip 按类聚焦。</div>
    </div>
    <div class="card">
      <h2>图例</h2>
      <div class="legend">
        <div class="lg"><span class="dot" style="background:var(--土)"></span>土·分析</div>
        <div class="lg"><span class="dot" style="background:var(--水)"></span>水·图谱</div>
        <div class="lg"><span class="dot" style="background:var(--木)"></span>木·复盘</div>
        <div class="lg"><span class="dot" style="background:var(--金)"></span>金·技能</div>
        <div class="lg"><span class="dot" style="background:var(--火)"></span>火·决策</div>
      </div>
      <div class="hint" style="margin-top:8px">异常标记：<span class="bad">红虚线</span>=孤儿/污染 · <span class="warn">橙圈</span>=决策缺技能支撑。</div>
    </div>
  </aside>
</main>

<script>
// ============ 1. 生成"很多点"的知识库（含真实 7 条种子 + 规模填充 + 注入异常） ============
const ELEMENTS=['土','水','木','金','火'];
const CAT={'土':'分析调研','水':'知识图谱','木':'反馈迭代','金':'技能','火':'决策模型'};
const ELCOLOR={'土':'#b45309','水':'#1e40af','木':'#059669','金':'#a16207','火':'#dc2626'};
const SEED={'土':'ComfyUI 全能力实测盘点','水':'五行知识图谱','木':'知识库审计复盘','金':'管理层五行学习技能','火':'内容开工审批原则'};
const COUNTS={'土':14,'水':14,'木':2,'金':16,'火':14}; // 木只给 2 个 → 故意五行失衡

let NODES=[],EDGES=[],idc=0;
const NODE_MAP={};
function addNode(el,label,opts={}){const id='k'+(idc++);const n={id,el,label,...opts};NODES.push(n);NODE_MAP[id]=n;return id;}

// 主连通网：每元素一条链，链间按 土→水→木→金→火→土 相生串联
const head={};
ELEMENTS.forEach((el,ei)=>{
  let prev=null;const ids=[];
  for(let i=0;i<COUNTS[el];i++){
    const label=(i===0&&SEED[el])?SEED[el]:(CAT[el]+'·条目'+i);
    const id=addNode(el,label); ids.push(id);
    if(prev)EDGES.push({s:prev,t:id,label:'关联',rel:'关联'});
    prev=id;
  }
  head[el]=ids[0];
  EDGES.push({s:ids[ids.length-1],t:head[ELEMENTS[(ei+1)%5]],label:'相生',rel:'生'});
});

// —— 注入异常 1：流水线污染冗余簇（8 个互连、仅 1 条外连，模拟你刚清掉的垃圾） ——
const gc=[];
for(let i=0;i<8;i++)gc.push(addNode('水','流水线残留-'+i,{anomaly:'garbage'}));
for(let i=0;i<gc.length;i++)for(let j=i+1;j<gc.length;j++)EDGES.push({s:gc[i],t:gc[j],label:'重复',rel:'关联'});
EDGES.push({s:gc[0],t:head['水'],label:'疑似重复',rel:'关联'}); // 唯一的对外连接

// —— 注入异常 2：孤儿草稿（无任何连接，死文档） ——
for(let i=0;i<4;i++)addNode('金','孤儿草稿-'+i,{anomaly:'orphan'});

// —— 注入异常 3：临时拍脑袋决策（火，只往外反哺，无金(技能)入边 → 缺支撑） ——
const bd=addNode('火','临时拍脑袋决策',{anomaly:'no-skill'});
EDGES.push({s:bd,t:head['土'],label:'反哺',rel:'生'}); // 只有出边，没有来自 金 的入边

// ============ 2. 图结构（邻接表） + 度数 ============
const adj={};NODES.forEach(n=>adj[n.id]=[]);
EDGES.forEach(e=>{adj[e.s].push({to:e.t,label:e.label,rel:e.rel});adj[e.t].push({to:e.s,label:e.label,rel:e.rel});});
const deg={};NODES.forEach(n=>deg[n.id]=0);EDGES.forEach(e=>{deg[e.s]++;deg[e.t]++;});

// ============ 3. 异常检测（图谱自动发现，等价于图数据库的拓扑查询） ============
function detectAnomalies(){
  const orphans=NODES.filter(n=>deg[n.id]===0);
  const noSkill=NODES.filter(n=>n.el==='火'&&!EDGES.some(e=>e.t===n.id&&NODE_MAP[e.s].el==='金'));
  const cnt={};ELEMENTS.forEach(e=>cnt[e]=0);NODES.forEach(n=>cnt[n.el]++);
  const weak=Object.entries(cnt).filter(([e,c])=>c<3).map(([e,c])=>CAT[e]+' 仅 '+c+' 条（水生木 可能断链）');
  // 连通分量：找"内部高度互连、对外仅 ≤1 边"的冗余/污染簇
  const seen=new Set(),comps=[];
  NODES.forEach(n=>{if(seen.has(n.id))return;const q=[n.id],c=[];seen.add(n.id);
    while(q.length){const u=q.shift();c.push(u);adj[u].forEach(e=>{if(!seen.has(e.to)){seen.add(e.to);q.push(e.to);}});}comps.push(c);});
  const garbage=comps.filter(c=>c.length>=5&&c.filter(id=>NODE_MAP[id].anomaly==='garbage').length>=5&&
    EDGES.filter(e=>(c.includes(e.s)&&!c.includes(e.t))||(!c.includes(e.s)&&c.includes(e.t))).length<=1);
  return {orphans,noSkill,weak,garbage};
}
const AN=detectAnomalies();

// ============ 4. 力导向布局 ============
const W=()=>document.getElementById('svg').clientWidth, H=()=>document.getElementById('svg').clientHeight;
const pos={},vel={};
NODES.forEach((n,i)=>{pos[n.id]={x:W()/2+Math.cos(i*2.4)*220,y:H()/2+Math.sin(i*2.4)*220};vel[n.id]={x:0,y:0};});
let alpha=1,dragging=null,fixed=null,degreeView=false,clusterMode=false,anomalyView=true,filterEl='all',hi=new Set(),hovered=null;

function tick(){
  const kRep=11000,kSpring=0.018,L0=95,center=0.010;
  NODES.forEach(a=>{ if(fixed===a.id)return; let fx=0,fy=0;
    NODES.forEach(b=>{if(a.id===b.id)return;let dx=pos[a.id].x-pos[b.id].x,dy=pos[a.id].y-pos[b.id].y,d2=dx*dx+dy*dy+0.01,d=Math.sqrt(d2);let f=kRep/d2;fx+=dx/d*f;fy+=dy/d*f;});
    adj[a.id].forEach(e=>{const b=pos[e.to];let dx=b.x-pos[a.id].x,dy=b.y-pos[a.id].y,d=Math.sqrt(dx*dx+dy*dy)+0.01;let f=kSpring*(d-L0);fx+=dx/d*f;fy+=dy/d*f;});
    if(clusterMode){ // 同元素互相轻微吸引 → 聚成簇
      NODES.forEach(b=>{if(b.id===a.id||b.el!==a.el)return;let dx=b.x-pos[a.id].x,dy=b.y-pos[a.id].y,d=Math.sqrt(dx*dx+dy*dy)+0.01;let f=0.006*(d-150);fx+=dx/d*f;fy+=dy/d*f;});
    }
    fx+=(W()/2-pos[a.id].x)*center;fy+=(H()/2-pos[a.id].y)*center;
    vel[a.id].x=(vel[a.id].x+fx*alpha)*0.85;vel[a.id].y=(vel[a.id].y+fy*alpha)*0.85;
    pos[a.id].x+=vel[a.id].x;pos[a.id].y+=vel[a.id].y;
  });
  alpha*=0.985;if(alpha<0.02)alpha=0.02;
}
function nodeOpacity(n){
  if(anomalyView&&!n.anomaly)return 0.10;
  if(filterEl!=='all'&&n.el!==filterEl)return 0.10;
  if(hi.size&&!hi.has(n.id))return 0.12;
  return 1;
}
function render(){
  const svg=document.getElementById('svg');svg.innerHTML='';
  // 聚类簇底圈
  if(clusterMode){const cx={};ELEMENTS.forEach(e=>cx[e]={x:0,y:0,n:0});
    NODES.forEach(n=>{if(nodeOpacity(n)>=0.5){cx[n.el].x+=pos[n.id].x;cx[n.el].y+=pos[n.id].y;cx[n.el].n++;}});
    ELEMENTS.forEach(e=>{if(!cx[e].n)return;const g=document.createElementNS('http://www.w3.org/2000/svg','circle');
      g.setAttribute('cx',cx[e].x/cx[e].n);g.setAttribute('cy',cx[e].y/cx[e].n);g.setAttribute('r',150);
      g.setAttribute('fill',ELCOLOR[e]);g.setAttribute('opacity','0.05');g.setAttribute('stroke',ELCOLOR[e]);g.setAttribute('stroke-opacity','0.25');svg.appendChild(g);
      const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',cx[e].x/cx[e].n);t.setAttribute('y',cx[e].y/cx[e].n-160);
      t.setAttribute('fill',ELCOLOR[e]);t.setAttribute('font-size','13');t.setAttribute('text-anchor','middle');t.textContent=CAT[e]+'（'+cx[e].n+'）';svg.appendChild(t);});}
  // 边
  EDGES.forEach(e=>{const a=pos[e.s],b=pos[e.t];const o=Math.min(nodeOpacity(NODE_MAP[e.s]),nodeOpacity(NODE_MAP[e.t]));
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',a.x);line.setAttribute('y1',a.y);line.setAttribute('x2',b.x);line.setAttribute('y2',b.y);
    const gar=NODE_MAP[e.s].anomaly==='garbage'&&NODE_MAP[e.t].anomaly==='garbage';
    line.setAttribute('stroke',gar?'#7f1d1d':(e.rel==='克'?'#f87171':(e.rel==='关联'?'#5b6aa8':'#465079')));
    line.setAttribute('stroke-width',gar?1.2:1.6);line.setAttribute('stroke-dasharray',gar?'3 3':'');
    line.setAttribute('opacity',o<0.5?o*0.5:0.55);svg.appendChild(line);});
  // 节点
  NODES.forEach(n=>{const p=pos[n.id];const r=degreeView?(5+deg[n.id]*1.6):(n.anomaly?9:7);
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);c.setAttribute('r',r);
    c.setAttribute('fill',ELCOLOR[n.el]);c.setAttribute('opacity',nodeOpacity(n));
    if(n.anomaly==='garbage'||n.anomaly==='orphan'){c.setAttribute('stroke','#ef4444');c.setAttribute('stroke-width',2);c.setAttribute('stroke-dasharray','3 2');}
    else if(n.anomaly==='no-skill'){c.setAttribute('stroke','#fbbf24');c.setAttribute('stroke-width',3);}
    else c.setAttribute('stroke',hi.has(n.id)?'#fff':'#0f1220');
    c.setAttribute('stroke-width',hi.has(n.id)?3:1.5);
    c.style.cursor='pointer';
    c.addEventListener('mousedown',ev=>{dragging=n.id;fixed=n.id;ev.preventDefault();});
    c.addEventListener('mouseup',()=>{dragging=null;});
    c.addEventListener('mouseenter',()=>{hovered=n.id;render();});
    c.addEventListener('mouseleave',()=>{hovered=null;render();});
    c.addEventListener('click',ev=>{ev.stopPropagation();onNodeClick(n.id);});
    svg.appendChild(c);
    const showLabel=n.anomaly||deg[n.id]>=4||hi.has(n.id)||hovered===n.id;
    if(showLabel){const t=document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x',p.x);t.setAttribute('y',p.y+r+11);t.setAttribute('fill','#e8ecf5');t.setAttribute('font-size','10');t.setAttribute('text-anchor','middle');
      t.textContent=n.label;t.setAttribute('opacity',nodeOpacity(n));svg.appendChild(t);}
  });
}
function loop(){tick();render();if(alpha>0.02||dragging)requestAnimationFrame(loop);}

// ============ 5. 交互：聚焦 / 最短路径 / 异常 ============
function neighbors(id,k){let cur=[id],seen=new Set([id]),res={1:new Set(),2:new Set()};
  for(let h=1;h<=k;h++){const nx=[];cur.forEach(u=>adj[u].forEach(e=>{if(!seen.has(e.to)){seen.add(e.to);res[h].add(e.to);nx.push(e.to);}}));cur=nx;}return res;}
function onNodeClick(id){const nb=neighbors(id,2);const h=new Set([id]);nb[1].forEach(x=>h.add(x));nb[2].forEach(x=>h.add(x));hi=h;render();
  const n=NODE_MAP[id];const rels=adj[id].map(e=>`<div class="anom"><span>${NODE_MAP[e.to].label}</span><span class="pill ${e.rel}">${e.rel}</span>${e.label}</div>`).join('');
  const flag=n.anomaly?`<div class="bad" style="margin:4px 0">⚠ 异常类型：${({garbage:'污染/冗余簇',orphan:'孤儿(无连接)','no-skill':'决策缺技能支撑'})[n.anomaly]}</div>`:'';
  document.getElementById('info').innerHTML=`<b>${n.label}</b>（${CAT[n.el]}）<div style="margin:6px 0">${n.tags?n.tags.map(t=>`<span class="tag">${t}</span>`).join(''):'度数 '+deg[id]}</div>${flag}<div class="hint">直接关系：</div>${rels}`;}

// ============ 6. 面板 / 按钮 ============
document.getElementById('sNodes').textContent=NODES.length;
document.getElementById('sEdges').textContent=EDGES.length;
document.getElementById('sAnom').textContent=AN.orphans.length+AN.garbage.length*AN.garbage[0].length+AN.noSkill.length;
const mainComp=(function(){const seen=new Set(),q=[NODES[0].id];seen.add(q[0]);while(q.length){const u=q.shift();adj[u].forEach(e=>{if(!seen.has(e.to)){seen.add(e.to);q.push(e.to);}});}return seen.size;})();
document.getElementById('sMain').textContent='主网 '+mainComp+' / 含孤立 '+ (NODES.length-mainComp);
function renderAnom(){
  let h='';
  h+=`<div class="anom"><span class="bad">🔴</span><div><b>孤儿知识（无连接 ${AN.orphans.length}）</b><br>${AN.orphans.map(n=>n.label).join('、')}<br><span class="hint">死文档/未引用，建议归档或删除</span></div></div>`;
  AN.garbage.forEach(c=>{h+=`<div class="anom"><span class="bad">🔴</span><div><b>冗余/污染簇（${c.length} 个互连、仅 1 条外连）</b><br>${c.slice(0,3).map(id=>NODE_MAP[id].label).join('、')}…<br><span class="hint">流水线重复产出，正是你刚清掉的那种垃圾</span></div></div>`;});
  h+=`<div class="anom"><span class="warn">🟠</span><div><b>决策缺技能支撑（${AN.noSkill.length}）</b><br>${AN.noSkill.map(n=>n.label).join('、')}<br><span class="hint">火无金入边 → 决策缺落地能力，应补技能/原则</span></div></div>`;
  AN.weak.forEach(w=>{h+=`<div class="anom"><span class="warn">🟠</span><div><b>五行失衡</b><br>${w}<br><span class="hint">复盘(木)过弱 → 水生木 断链 → 知识不进化</span></div></div>`;});
  document.getElementById('anomBox').innerHTML=h;
}
renderAnom();

document.getElementById('svg').addEventListener('mousemove',ev=>{if(!dragging)return;const r=document.getElementById('svg').getBoundingClientRect();pos[dragging].x=ev.clientX-r.left;pos[dragging].y=ev.clientY-r.top;});
document.getElementById('svg').addEventListener('click',()=>{if(!anomalyView&&filterEl==='all'){hi.clear();render();document.getElementById('info').innerHTML='悬停/点击节点看详情；点「异常视图」只看异常；点五行 chip 按类聚焦。';}});
document.getElementById('btnReset').onclick=()=>{hi.clear();hovered=null;anomalyView=true;filterEl='all';degreeView=false;clusterMode=false;document.getElementById('btnAnomaly').classList.add('on');document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.el==='all'));NODES.forEach((n,i)=>{pos[n.id].x=W()/2+Math.cos(i*2.4)*220;pos[n.id].y=H()/2+Math.sin(i*2.4)*220;});alpha=0.6;requestAnimationFrame(loop);};
document.getElementById('btnDegree').onclick=function(){degreeView=!degreeView;this.classList.toggle('on',degreeView);if(degreeView)document.getElementById('info').innerHTML='已按<b>度中心性</b>缩放：被引用越多节点越大。';render();};
document.getElementById('btnCluster').onclick=function(){clusterMode=!clusterMode;this.classList.toggle('on',clusterMode);if(clusterMode){alpha=0.5;requestAnimationFrame(loop);document.getElementById('info').innerHTML='已开启<b>五行聚类</b>：同属性节点聚成 5 团，先看成簇再下钻。';}else render();};
document.getElementById('btnAnomaly').onclick=function(){anomalyView=!anomalyView;this.classList.toggle('on',anomalyView);hi.clear();render();};
document.querySelectorAll('.chip').forEach(chip=>chip.onclick=function(){document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));this.classList.add('on');filterEl=this.dataset.el;hi.clear();render();});

loop();
</script>
</body>
</html>
