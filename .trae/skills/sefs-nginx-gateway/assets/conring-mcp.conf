# conring MCP path routing -> 192.168.21.206 (206 的 21 网段 = ens2f1np1 万兆直连)
# Included by the port 80 default_server (sefs-mcp.conf) and the 443 server (proxy_8001.conf).
#   /conring/mail/*    -> 192.168.21.206:9100  (mail, e.g. /conring/mail/ceo/mcp)
#   /conring/tts/*     -> 192.168.21.206:9101  (tts,  e.g. /conring/tts/mcp)
#   /conring/asr/*     -> 192.168.21.206:9102  (asr,  e.g. /conring/asr/mcp)
#   /conring/media/*   -> 192.168.21.206:9200  (media-engine: /health、/v1/*)
#   /conring/media/files/*  -> 404（引擎的 /files/{name} 无鉴权，不对公网开放）
# proxy_pass with trailing slash strips the /conring/<svc>/ prefix.
# 上游一律写 21 网段；192.168.31.206 只服务办公网直连客户端，不要出现在这里。

location /conring/mail/ {
    proxy_pass http://192.168.21.206:9100/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # MCP keeps long-lived SSE streams open; never buffer them.
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location /conring/tts/ {
    proxy_pass http://192.168.21.206:9101/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location /conring/asr/ {
    proxy_pass http://192.168.21.206:9102/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# ---- media-engine (192.168.21.206:9200) ----
# 前缀更长，优先匹配；先于下面的 /conring/media/ 生效。
location /conring/media/files/ {
    return 404;
}

location /conring/media/ {
    proxy_pass http://192.168.21.206:9200/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # ASR 走 base64/上传，引擎侧上限 MEDIA_MAX_BODY_MB=25
    client_max_body_size 32m;
}

# ---- dispatch 调度中心 (192.168.21.206) ----
#   /conring/dispatch/*     -> 192.168.21.206:9120  (HTTP: submit/status/health)
#   /conring/dispatch-ws/*  -> 192.168.21.206:9121  (实时通话 WebSocket)
location /conring/dispatch/ {
    proxy_pass http://192.168.21.206:9120/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location /conring/dispatch-ws/ {
    proxy_pass http://192.168.21.206:9121/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
