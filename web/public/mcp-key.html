<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>外部 Agent API Key · OPC</title>
<style>
:root{color-scheme:light;--ink:#1c2430;--muted:#667085;--line:#e4e7ec;--accent:#2f6df6;--bg:#f7f8fa}
*{box-sizing:border-box}body{margin:0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}
.wrap{max-width:860px;margin:40px auto;padding:0 20px}h1{font-size:22px;margin:0 0 6px}.sub{color:var(--muted);margin:0 0 24px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.badge{padding:2px 10px;border-radius:999px;font-size:12px;background:#eef4ff;color:#175cd3}.badge.off{background:#f2f4f7;color:#667085}
button{border:0;border-radius:8px;padding:9px 16px;font-size:14px;cursor:pointer;background:var(--accent);color:#fff}button.ghost{background:#fff;color:#344054;border:1px solid var(--line)}
pre,textarea{font-family:ui-monospace,Menlo,Consolas,monospace}pre{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;overflow:auto;white-space:pre-wrap;word-break:break-all}
textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:10px}.hint{color:var(--muted);font-size:13px}.err{color:#b42318;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
<h1>外部 Agent API Key</h1>
<p class="sub">登录后按手机号领取个人 key，用于豆包工作 / WorkBuddy / CodeBuddy 调用 OPC MCP。接入时只需要这一串 key，手机号仅在领取时用于认领身份。</p>
<div class="card">
<div class="row"><span>当前账号：<b id="phone">—</b></span><span id="badge" class="badge off">检测中…</span></div>
<p class="hint">key 只存 sha256，页面无法回显；忘记或泄漏请重新生成。</p>
<div class="row"><button id="gen">生成 / 重新生成 key</button><button id="revoke" class="ghost">撤销当前 key</button><button id="refresh" class="ghost">刷新状态</button></div>
<div id="msg" class="hint"></div>
</div>
<div class="card" id="result" style="display:none">
<h2 style="font-size:16px;margin-top:0">请立即复制并保存（只显示这一次）</h2>
<textarea id="key" readonly></textarea>
<div class="row" style="margin-top:8px"><button id="copy" class="ghost">复制 key</button></div>
<h3 style="font-size:14px;margin:18px 0 6px">WorkBuddy / CodeBuddy（HTTP）</h3><pre id="cfg-http"></pre>
<h3 style="font-size:14px;margin:18px 0 6px">豆包（不能设请求头时用路径式 URL）</h3><pre id="cfg-path"></pre>
</div>
<div class="card"><h2 style="font-size:16px;margin-top:0">MCP 地址</h2><pre id="urls">加载中…</pre>
<p class="hint">外部 agent 提示缺 key 时，错误信息会带本页地址；回到这里登录后生成即可。撤销后旧 key 立即失效。</p></div>
</div>
<script>
const $=id=>document.getElementById(id);
function say(t,err){$('msg').textContent=t||'';$('msg').className=err?'err':'hint'}
async function api(action){var opt=action?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:action})}:{};var r=await fetch('api/mcp-key',opt);if(r.status===401){location.href='login?next='+encodeURIComponent(location.pathname);return null}var d=await r.json();if(!r.ok||d.ok===false)throw new Error(d.error||('HTTP '+r.status));return d}
function render(d){$('phone').textContent=d.phone||'—';$('badge').textContent=d.configured?'已配置':'未配置';$('badge').className='badge'+(d.configured?'':' off');$('urls').textContent='MCP:    '+(d.mcp_url||'')+'\n上传:  '+(d.upload_url||'')+'\n申请页: '+(d.apply_url||location.href)+'\nOPC 根目录: '+(d.dataDir||'')+'\nVault:  '+(d.vault||'')}
function showKey(d){$('result').style.display='block';$('key').value=d.key||'';$('cfg-http').textContent=JSON.stringify({mcpServers:{'opc-kb':{type:'http',url:d.mcp_url,headers:{'X-Mail-Agent':d.key}}}},null,2);$('cfg-path').textContent=d.doubao_url||''}
$('refresh').onclick=function(){api(null).then(function(d){if(d){render(d);say('')}}).catch(function(e){say(e.message,true)})};
$('gen').onclick=function(){api('create').then(function(d){if(d){render(d);showKey(d);say('已生成，仅显示这一次',false)}}).catch(function(e){say(e.message,true)})};
$('revoke').onclick=function(){if(!confirm('确定撤销当前 key？'))return;api('revoke').then(function(d){if(d){render(d);$('result').style.display='none';say('已撤销',false)}}).catch(function(e){say(e.message,true)})};
$('copy').onclick=function(){$('key').select();document.execCommand('copy');say('已复制',false)};
api(null).then(function(d){if(d)render(d)}).catch(function(e){say(e.message,true)});
</script>
</body>
</html>
