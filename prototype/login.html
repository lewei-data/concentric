<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>登录 · 同心圆 AI 工作台</title>
<style>
  :root{
    --ink:#111827; --muted:#6B7280; --line:#E5E7EB; --primary:#4F46E5;
    --err:#DC2626; --ok:#059669;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;display:grid;place-items:center;padding:24px;
    background:radial-gradient(1200px 600px at 15% 8%, #E8EEFF 0%, #F5F7FC 46%, #EEF2FA 100%);
    color:var(--ink);
    font-family:ui-sans-serif,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  .ring{position:fixed;left:50%;top:50%;width:900px;height:900px;transform:translate(-50%,-50%);
    pointer-events:none;opacity:.5}
  .card{position:relative;width:min(420px,92vw);background:#fff;border:1px solid #fff;border-radius:20px;
    padding:30px 30px 24px;box-shadow:0 26px 70px rgba(17,24,39,.14),0 2px 8px rgba(17,24,39,.05);
    backdrop-filter:blur(6px)}
  .logo{display:flex;align-items:center;gap:10px}
  .mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#4F46E5,#7C3AED);
    display:grid;place-items:center;box-shadow:0 6px 18px rgba(79,70,229,.28);flex:none}
  .mark svg{width:26px;height:26px;display:block}
  .brand{display:flex;flex-direction:column;line-height:1.2}
  .brand b{font-size:17px;letter-spacing:1.4px}
  .brand i{font-style:normal;font-size:10.5px;color:var(--muted);letter-spacing:1.5px}
  h1{margin:24px 0 6px;font-size:22px;letter-spacing:.5px}
  .sub{margin:0;font-size:12.5px;color:var(--muted);line-height:1.7}

  form{margin-top:16px}
  label{display:block;font-size:12px;color:#374151;font-weight:700;margin-bottom:6px}
  .field{position:relative}
  .field + label{margin-top:14px}
  input{width:100%;padding:12px 44px 12px 13px;font-size:14px;border:1px solid var(--line);border-radius:11px;
    outline:none;background:#FBFCFE;color:var(--ink);transition:border-color .15s,box-shadow .15s}
  input:focus{border-color:#A5B4FC;box-shadow:0 0 0 4px rgba(79,70,229,.12);background:#fff}
  input:disabled{opacity:.7}
  .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;
    color:#9CA3AF;font-size:11.5px;cursor:pointer;padding:6px 8px;border-radius:8px}
  .eye:hover{background:#F1F5F9;color:#4B5563}
  button.go{margin-top:14px;width:100%;border:0;border-radius:11px;padding:12px 14px;cursor:pointer;
    background:linear-gradient(135deg,#4F46E5,#6D28D9);color:#fff;font-size:14px;font-weight:800;letter-spacing:1px;
    box-shadow:0 10px 24px rgba(79,70,229,.26);transition:transform .12s,box-shadow .12s,opacity .12s}
  button.go:hover{transform:translateY(-1px);box-shadow:0 14px 30px rgba(79,70,229,.30)}
  button.go:disabled{cursor:default;opacity:.65;transform:none;box-shadow:none}
  .msg{min-height:18px;margin-top:10px;font-size:12px;line-height:1.6}
  .msg.bad{color:var(--err)}
  .msg.good{color:var(--ok)}
  .hint{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:11px;color:#9CA3AF;line-height:1.7}
  .hint code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;
    background:#F3F4F6;border:1px solid #E5E7EB;border-radius:5px;padding:1px 5px;color:#4B5563}
  @media (max-width:480px){.card{padding:24px 20px 20px}h1{font-size:20px}}
</style>
</head>
<body>

<svg class="ring" viewBox="0 0 900 900" fill="none" aria-hidden="true">
  <circle cx="450" cy="450" r="330" stroke="#4F46E5" stroke-opacity=".10" stroke-width="2"/>
  <circle cx="450" cy="450" r="250" stroke="#7C3AED" stroke-opacity=".12" stroke-width="2"/>
  <circle cx="450" cy="450" r="170" stroke="#0EA5E9" stroke-opacity=".12" stroke-width="2"/>
  <circle cx="450" cy="450" r="90" stroke="#4F46E5" stroke-opacity=".14" stroke-width="2"/>
</svg>

<div class="card">
  <div class="logo">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="12" stroke="#fff" stroke-width="2.4" opacity=".95"/>
        <circle cx="16" cy="16" r="7" stroke="#fff" stroke-width="2.2" opacity=".75"/>
        <circle cx="16" cy="16" r="2.4" fill="#fff"/>
        <circle cx="28" cy="16" r="1.8" fill="#fff"/>
      </svg>
    </span>
    <span class="brand"><b>同心圆</b><i>CONCENTRIC · AI WORKSPACE</i></span>
  </div>

  <h1>登录工作台</h1>
  <p class="sub">账号支持手机号、邮箱或用户名；多个成员可在同一张凭据表里各自配置。</p>

  <form id="f" autocomplete="off">
    <label for="acc">手机号 / 邮箱</label>
    <div class="field">
      <input id="acc" type="text" name="account" inputmode="text" placeholder="手机号或邮箱"
             autocomplete="username" autocapitalize="off" spellcheck="false" autofocus required />
    </div>
    <label for="pwd">密码</label>
    <div class="field">
      <input id="pwd" type="password" name="password" placeholder="请输入密码" autocomplete="current-password"
             required />
      <button class="eye" type="button" id="eye">显示</button>
    </div>
    <button class="go" type="submit" id="go">登 录</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="hint">
    账号与密码存放在 Obsidian：<code id="credPath">公司/登录凭据.md</code>，改完立即生效，无需重启服务。
  </div>
</div>

<script>
  const qs = new URLSearchParams(location.search);
  // 根路径已默认跳 /app，未带 next 的登录也进入新版工作台；
  // 从旧版 /legacy、3D 页面等带 next 进来时仍回跳原页面。
  const nextRaw = qs.get('next') || '/app';
  // 只接受站内路径，避免被拼成外站跳转
  const next = nextRaw.startsWith('/') && !nextRaw.startsWith('//') ? nextRaw : '/app';

  const f = document.getElementById('f');
  const acc = document.getElementById('acc');
  const pwd = document.getElementById('pwd');
  const go = document.getElementById('go');
  const msg = document.getElementById('msg');
  const eye = document.getElementById('eye');

  eye.onclick = () => {
    const on = pwd.type === 'password';
    pwd.type = on ? 'text' : 'password';
    eye.textContent = on ? '隐藏' : '显示';
    pwd.focus();
  };

  function say(text, cls) {
    msg.textContent = text || '';
    msg.className = 'msg' + (cls ? ' ' + cls : '');
  }

  fetch('/api/logininfo').then(r => r.json()).then(d => {
    if (d && d.file) document.getElementById('credPath').textContent = d.file;
    if (d && d.ready === false) {
      say('服务端还没有配置登录账号，请先写 ' + (d.file || '公司/登录凭据.md'), 'bad');
    }
  }).catch(() => {});

  f.onsubmit = async (e) => {
    e.preventDefault();
    const account = acc.value.trim();
    const password = pwd.value.trim();
    if (!account) { say('请输入手机号或邮箱', 'bad'); acc.focus(); return; }
    if (!password) { say('请输入密码', 'bad'); pwd.focus(); return; }
    go.disabled = true;
    say('正在验证…');
    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ account, password })
      });
      const d = await r.json().catch(() => ({}));
      if (r.ok && d.ok) {
        say('验证通过，正在进入工作台…', 'good');
        location.replace(next);
        return;
      }
      say(d.error || ('验证失败（' + r.status + '）'), 'bad');
    } catch (err) {
      say('网络异常：' + err, 'bad');
    }
    go.disabled = false;
    pwd.select();
  };
</script>
</body>
</html>
