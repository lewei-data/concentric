# OPC 内容流水线定义（唯一事实来源）
#
# 约定：
#   - id 与 prototype/server.py 里的 _stage_<id> 方法一一对应；顺序即执行顺序。
#   - item_stage 是内容单（item.stage）对外暴露的稳定状态名，前端/报表只认它。
#   - kind: produce（产出）/ gate（评审门）/ approval（人工审批）/ terminal（收口）
#   - rounds: 该阶段内部“评审-返工”最大轮次（不写默认 2）
#   - om_stage: 与 OpenMontage 8 阶段的映射（research/proposal/script/scene_plan/
#     assets/edit/compose/publish），用于 checkpoint 对齐；无对应阶段留空。
#   - approval_action: 与高危工具表一致的动作名，审批单 action 取此值。
#   - timeout_sec 留空表示沿用 OPC_APPROVAL_TIMEOUT（默认 600s）。
#
# 改本文件需同步 server.py 的 _stage_* 实现；启动时会校验 id 是否都有实现。

version: 1
name: opc-content-pipeline
description: 热点 → 选题 → 开工审批 → 制作 → 样片评审 → 定版 → 终审 → 发布审批 → 发布 → 归档 → 汇报
projects: [wenren, gou, tongxinyuan]

stages:
  - id: topic_meeting
    name: 每日选题会
    kind: produce
    item_stage: topic
    om_stage: research
    description: PM 各提 4 条候选，CCO 12 选 9

  - id: topic_review
    name: 选题评审会
    kind: gate
    item_stage: topic
    om_stage: proposal
    description: CEO/CTO/CCO + 项目 PM 定稿 6 条并归档纪要

  - id: boss_report
    name: 选题结果汇报
    kind: produce
    description: CCO 邮件汇报老板，附开工审批入口

  - id: create_items
    name: 建内容单
    kind: produce
    item_stage: topic
    description: 每条定稿建一张内容单，派生 PM/CW/VD 工单

  - id: production_approval
    name: 开工审批
    kind: approval
    approval_action: production.start
    timeout_sec: null
    on_reject: stop
    description: 老板批准后才进入制作（成本/素材/合规摘要）

  - id: assessment
    name: 制作评估
    kind: produce
    item_stage: topic
    om_stage: proposal
    description: PM 出《制作评估报告》，scout 补素材缺口

  - id: copy
    name: 文案成稿
    kind: produce
    item_stage: copy
    om_stage: script

  - id: sample
    name: 样片方案
    kind: produce
    item_stage: sample
    om_stage: scene_plan
    description: 逐镜剧本、封面、配音/TTS 方案

  - id: render
    name: 真实出片
    kind: gate
    item_stage: sample
    om_stage: assets
    description: MCP-TTS 旁白 + OpenMontage/Remotion 渲染 + 画面验收门

  - id: sample_review
    name: 样片三方评审
    kind: gate
    item_stage: sample
    om_stage: edit
    rounds: 2
    description: CCO + CTO + 本项目 PM 评审，不过则返工重出片

  - id: final
    name: 定版
    kind: produce
    item_stage: final
    om_stage: compose
    description: 过审样片锁定为 05-final.mp4，不二次剪辑

  - id: review
    name: 审核员终审
    kind: gate
    item_stage: review
    rounds: 2
    description: 交付合同硬门槛复检；驳回返工重写

  - id: publish_approval
    name: 发布审批
    kind: approval
    item_stage: approved
    approval_action: publish.execute
    timeout_sec: null
    on_reject: stop
    description: 仅放行审核通过的内容

  - id: release
    name: 发布
    kind: produce
    item_stage: published
    om_stage: publish

  - id: archive
    name: 知识归档
    kind: produce
    item_stage: archived

  - id: report
    name: 汇报生成
    kind: produce
    description: CEO 日报 / CTO 技术周报 / 项目周报
